[package]
name = "devops-commander"
version = "0.1.0"
description = "CargoShip - VPS Management Tool"
authors = ["you"]
edition = "2021"

[lib]
name = "devops_commander_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SSH
ssh2 = "0.9"
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "encryption", "std"] }
socket2 = "0.5"
rand = "0.8"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Secure credential storage
# Platform-specific features:
# - windows-native: Windows Credential Manager
# - apple-native: macOS Keychain
# - sync-secret-service: Linux Secret Service (DBus)
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"

# Hashing
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

# YAML support for deployment scripts
serde_yaml = "0.9"

# Variable interpolation
regex = "1"
whoami = "1"

# Local terminal PTY
portable-pty = "0.8"
dirs = "5"
